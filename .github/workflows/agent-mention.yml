name: "Агент · Доработка по @claude"

# Владелец пишет в PR комментарий с @claude — агент отвечает
# или дорабатывает ветку PR (например: «@claude поправь замечания ревью»).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: agent-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Только владелец, только в PR, и только если ветка PR — из этого же репозитория:
    # агент запускает тесты и сборку с правом записи, код из форка сюда попасть не должен.
    if: |
      github.event.sender.login == github.repository_owner &&
      (
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # В событии issue_comment нет сведений о ветке PR — проверяем через API.
      - name: PR из этого репозитория?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name // ""')
          if [ "$HEAD" = "$REPO" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "PR из форка ($HEAD) — пропускаю."; fi
      - uses: actions/checkout@v6
        if: steps.guard.outputs.ok == 'true'
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.ok == 'true'

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          include_comments_by_actor: "${{ github.repository_owner }},github-actions[bot],claude[bot]"
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 120
            --append-system-prompt "Соблюдай правила из .claude/pipeline/build.md (раздел «Жёсткие правила»)."
            --allowedTools "Bash(npm run lint),Bash(npm run typecheck),Bash(npm test),Bash(npm test:*),Bash(npm run build),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
