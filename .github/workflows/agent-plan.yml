name: "Агент · 1 · План"

# Запускает мост (agent-bridge), когда в Linear задачу перевели в статус Planning
# или владелец ответил на вопросы агента (задача в статусе Questions).
# Итог: вопросы -> статус Questions, план -> статус Plan Review.
# Агент читает код и пишет либо вопросы, либо план — результат уходит комментарием в Linear.
#
# Два задания намеренно: в первом работает агент — у него нет ни ключа Linear, ни
# права менять код; второе публикует его файлы из чистой копии master, так что агент
# не может подменить скрипт, который работает с ключом.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Задача Linear, например CRY-12"
        required: true
        type: string
      force:
        description: "Запустить при любом статусе задачи"
        type: boolean
        default: false

concurrency:
  group: agent-plan-${{ inputs.issue }}
  cancel-in-progress: true

env:
  ISSUE: ${{ inputs.issue }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      go: ${{ steps.claim.outputs.go }}
    steps:
      - uses: actions/checkout@v6

      - name: Взять задачу из Linear
        id: claim
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          L="node .github/scripts/linear.mjs"
          # Планируем только задачу в статусе Planning или Questions.
          GO=$($L claim "$ISSUE" plan | sed -n 's/^go=//p')
          if [ "$FORCE" = "true" ]; then GO=true; fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          if [ "$GO" = "true" ]; then
            mkdir -p .agent-context
            $L fetch "$ISSUE" .agent-context/task.md
          else
            echo "Задача не в статусе Planning / Questions — пропускаю."
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.claim.outputs.go == 'true'
        timeout-minutes: 15
        with:
          # Задайте ОДИН из двух секретов (см. docs/PIPELINE.md).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Токен задания вместо токена приложения: права ровно те, что в permissions выше.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Ты — планировщик. Выполни инструкцию из файла .claude/pipeline/plan.md.
            Текст задачи и переписка по ней лежат в .agent-context/task.md.
            Результат запиши в .agent-context/questions.md ИЛИ в .agent-context/plan.md.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write"

      - name: Собрать результат
        if: ${{ !cancelled() && steps.claim.outputs.go == 'true' }}
        run: |
          mkdir -p out
          for f in questions.md plan.md; do
            if [ -s ".agent-context/$f" ]; then head -c 100000 ".agent-context/$f" > "out/$f"; fi
          done
          touch out/.keep
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.claim.outputs.go == 'true' }}
        with:
          name: plan-result
          path: out/
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: plan
    # Отменённый запуск (пришёл новый ответ владельца) ничего не публикует.
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: plan-result
          path: ${{ runner.temp }}/out
      - name: Опубликовать вопросы или план в Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OUT: ${{ runner.temp }}/out
        run: |
          L="node .github/scripts/linear.mjs"
          if [ -s "$OUT/questions.md" ] && [ ! -s "$OUT/plan.md" ]; then
            $L comment "$ISSUE" "$OUT/questions.md"
            $L state "$ISSUE" questions
          elif [ -s "$OUT/plan.md" ]; then
            $L comment "$ISSUE" "$OUT/plan.md"
            $L state "$ISSUE" review
          else
            $L say "$ISSUE" "Планировщик не выдал результат. [Лог запуска]($RUN_URL). Перезапуск: переведите задачу в другой статус и снова в Planning."
            exit 1
          fi
